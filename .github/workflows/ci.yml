name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Create the environment
        run: |
          uv venv --python ${{ matrix.python-version }}
          # CPU wheels only. Nothing here needs CUDA and the GPU build pulls
          # triton plus five nvidia-* wheels, roughly 3 GB per job.
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev]"

      # `uv run` re-syncs the project environment before running anything, which
      # silently replaces the CPU wheel above with the default-index CUDA build.
      # Call the tools out of .venv directly so the environment stays as built.
      - name: Confirm the CPU build survived
        run: |
          .venv/bin/python - <<'PY'
          import torch
          assert torch.__version__.endswith("+cpu"), (
              f"expected a CPU build, got {torch.__version__}. Something re-resolved "
              "torch from the default index — check for a stray `uv run`."
          )
          print(torch.__version__)
          PY

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Type check
        run: .venv/bin/mypy

      - name: Test
        run: .venv/bin/pytest -q --cov=printscale --cov-report=term-missing

      # The pinned digests are the security boundary for weight downloads.
      # Check they still match what upstream publishes, without failing the
      # build on a network hiccup.
      - name: Verify pinned weight digests
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: .venv/bin/printscale weights --fetch general-x4v3
