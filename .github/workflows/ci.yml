name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      # CPU wheels only. No test needs CUDA, and the GPU wheel is ~2 GB.
      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev]"

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest -q --cov=printscale --cov-report=term-missing

      # The registry digests are the security boundary for weight downloads.
      # Verify the pinned hashes still match what upstream publishes, but do not
      # fail the build on a network hiccup.
      - name: Verify pinned weight digests
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: uv run printscale weights --fetch general-x4v3
